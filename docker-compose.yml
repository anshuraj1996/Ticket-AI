# SmartTicket AI: local stack
#   docker compose up --build
#
#   App (frontend + /api proxy) -> http://localhost:8080
#   Backend API (direct)        -> http://localhost:3000
#   Inngest dev dashboard       -> http://localhost:8288
#   Kafka UI                    -> http://localhost:8081
#   Kafka (from host)           -> localhost:9094
#   MongoDB                     -> mongodb://localhost:27017
#   Redis                       -> redis://localhost:6379

name: smartticket

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cache + rate-limit store. No persistence: everything in it can be rebuilt.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Containers connect to kafka:9092, tools on the host to localhost:9094.
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Default is 50 partitions, which takes minutes to create on Docker Desktop
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartticket
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # Reads ticket-events from Kafka and writes the audit log to MongoDB.
  # Same image as the backend, different entrypoint.
  ticket-consumer:
    build:
      context: ./BACKEND
    image: smartticket-backend:latest
    command: ["node", "kafka/consumer.js"]
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/smartticket
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: smartticket-consumer
      KAFKA_CONSUMER_GROUP: ticket-audit
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Local Inngest dev server: receives events from the backend and
  # calls back into /api/inngest to run the workflow steps.
  inngest:
    image: inngest/inngest:v1.12.0
    command: "inngest dev -u http://backend:3000/api/inngest"
    restart: unless-stopped
    ports:
      - "8288:8288"
    depends_on:
      - backend

  backend:
    build:
      context: ./BACKEND
    image: smartticket-backend:latest
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/smartticket
      # Point the Inngest SDK at the local dev server instead of Inngest Cloud
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://inngest:8288
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_URL: /api
    image: smartticket-frontend:latest
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mongo-data:
