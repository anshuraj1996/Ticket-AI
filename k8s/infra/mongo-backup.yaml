# Nightly MongoDB backup: gzipped mongodump archive on its own volume, 7 days kept.
#
# Run one now:   bash k8s/mk-kubectl.sh -n smartticket create job --from=cronjob/mongo-backup mongo-backup-manual
# Restore:       see k8s/README.md ("Backups")
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backups
  labels:
    app.kubernetes.io/name: mongo-backup
    app.kubernetes.io/part-of: smartticket
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  labels:
    app.kubernetes.io/name: mongo-backup
    app.kubernetes.io/part-of: smartticket
spec:
  schedule: "0 2 * * *" # 02:00 every day (cluster time zone, usually UTC)
  concurrencyPolicy: Forbid # never run two backups at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongo-backup # allowed by the allow-mongo NetworkPolicy
            app.kubernetes.io/part-of: smartticket
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999 # "mongodb" user in the mongo image
            runAsGroup: 999
            fsGroup: 999 # write access to the backup volume
          containers:
            - name: backup
              image: mongo:7
              env:
                - name: MONGO_URI
                  valueFrom:
                    configMapKeyRef:
                      name: backend-config
                      key: MONGO_URI
                - name: RETENTION_DAYS
                  value: "7"
              command:
                - sh
                - -c
                - |
                  set -e
                  file="/backups/smartticket-$(date +%Y%m%d-%H%M%S).archive.gz"
                  mongodump --uri="$MONGO_URI" --gzip --archive="$file"
                  echo "Backup written: $file"
                  find /backups -name 'smartticket-*.archive.gz' -mtime +"$RETENTION_DAYS" -print -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mongo-backups
