# TEMPLATE ONLY: not part of kustomization.yaml. Never commit real values.
#
# Easiest way to create the real Secret from the project's .env file:
#   kubectl -n smartticket create secret generic backend-secrets --from-env-file=.env
#
# Or copy this file to secret.yaml (gitignored), fill it in, and:
#   kubectl -n smartticket apply -f k8s/backend/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: smartticket
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string
  GEMINI_API_KEY: ""
  GMAIL_USER: ""
  GMAIL_PASS: ""
