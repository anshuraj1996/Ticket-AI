# Voluntary disruptions (node drain, cluster upgrade) must leave at least 1 API pod running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: smartticket
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
