# Kafka consumer: reads "ticket-events" and writes the audit log to MongoDB.
# Same image as the API, different command. Can scale up to the topic's
# partition count (3); extra replicas would sit idle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-consumer
  labels:
    app.kubernetes.io/name: ticket-consumer
    app.kubernetes.io/component: consumer
    app.kubernetes.io/part-of: smartticket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-consumer
        app.kubernetes.io/component: consumer
        app.kubernetes.io/part-of: smartticket
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false # app never calls the Kubernetes API
      terminationGracePeriodSeconds: 30 # consumer.js disconnects cleanly on SIGTERM
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongo 27017; do echo "waiting for mongo"; sleep 2; done
              until nc -z kafka 9092; do echo "waiting for kafka"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: consumer
          image: smartticket-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["node", "kafka/consumer.js"]
          env:
            - name: KAFKA_CLIENT_ID
              value: smartticket-consumer
            - name: KAFKA_CONSUMER_GROUP
              value: ticket-audit
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
