# Backend API (Express). Also serves /api/inngest for the Inngest workflow callbacks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: smartticket
spec:
  # No "replicas": the HorizontalPodAutoscaler (hpa.yaml) owns the replica count
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # keep full capacity during rollouts
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: smartticket
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false # app never calls the Kubernetes API
      terminationGracePeriodSeconds: 30 # index.js closes the server + Kafka producer on SIGTERM
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user in the image
        runAsGroup: 1000
      # mongoose.connect() does not retry its first attempt, so wait until dependencies answer
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongo 27017; do echo "waiting for mongo"; sleep 2; done
              until nc -z kafka 9092; do echo "waiting for kafka"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: backend
          image: smartticket-backend:1.0.0
          imagePullPolicy: IfNotPresent # image is loaded into minikube, not pulled from a registry
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
