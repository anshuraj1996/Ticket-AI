# In-cluster dependencies. Disable each one in values.yaml to use a managed service instead.
{{- if .Values.mongo.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        {{- include "smartticket.podLabels" . | nindent 8 }}
    spec:
      {{- include "smartticket.podDefaults" . | nindent 6 }}
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mongo.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storage }}
{{- if .Values.mongo.backup.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backups
  labels:
    app.kubernetes.io/name: mongo-backup
    {{- include "smartticket.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep # `helm uninstall` must not delete the backups
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.mongo.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mongo.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  labels:
    app.kubernetes.io/name: mongo-backup
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.mongo.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongo-backup
            {{- include "smartticket.podLabels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- include "smartticket.podDefaults" . | nindent 10 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: backup
              image: {{ .Values.mongo.image }}
              env:
                - name: MONGO_URI
                  valueFrom:
                    configMapKeyRef:
                      name: backend-config
                      key: MONGO_URI
                - name: RETENTION_DAYS
                  value: {{ .Values.mongo.backup.retentionDays | quote }}
              command:
                - sh
                - -c
                - |
                  set -e
                  file="/backups/smartticket-$(date +%Y%m%d-%H%M%S).archive.gz"
                  mongodump --uri="$MONGO_URI" --gzip --archive="$file"
                  echo "Backup written: $file"
                  find /backups -name 'smartticket-*.archive.gz' -mtime +"$RETENTION_DAYS" -print -delete
                  ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 512Mi }
              {{- include "smartticket.containerSecurity" . | nindent 14 }}
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: mongo-backups
{{- end }}
{{- end }}

{{- if .Values.kafka.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        {{- include "smartticket.podLabels" . | nindent 8 }}
    spec:
      # enableServiceLinks=false is required: the apache/kafka image turns every
      # KAFKA_* env var (including the injected KAFKA_PORT) into broker config
      {{- include "smartticket.podDefaults" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "INTERNAL://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_NUM_PARTITIONS, value: {{ .Values.kafka.partitions | quote }} }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.kafka.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
{{- end }}

{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        {{- include "smartticket.podLabels" . | nindent 8 }}
    spec:
      {{- include "smartticket.podDefaults" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--save", "", "--appendonly", "no",
                 "--maxmemory", {{ .Values.redis.maxmemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          {{- include "smartticket.containerSecurity" . | nindent 10 }}
{{- end }}

{{- if .Values.inngest.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: inngest
  labels:
    app.kubernetes.io/name: inngest
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: inngest
  ports:
    - name: http
      port: 8288
      targetPort: 8288
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inngest
  labels:
    app.kubernetes.io/name: inngest
    {{- include "smartticket.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inngest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inngest
        {{- include "smartticket.podLabels" . | nindent 8 }}
    spec:
      {{- include "smartticket.podDefaults" . | nindent 6 }}
      containers:
        - name: inngest
          image: {{ .Values.inngest.image }}
          args: ["inngest", "dev", "-u", "http://backend:3000/api/inngest"]
          ports:
            - name: http
              containerPort: 8288
          readinessProbe:
            httpGet: { path: /, port: 8288 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.inngest.resources | nindent 12 }}
{{- end }}
