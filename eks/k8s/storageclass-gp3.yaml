# Default StorageClass for EKS: EBS gp3 through the EBS CSI driver (installed by Terraform).
# gp3 is ~20% cheaper than gp2 with a 3000 IOPS baseline regardless of size.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer # create the volume in the AZ where the pod lands
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
